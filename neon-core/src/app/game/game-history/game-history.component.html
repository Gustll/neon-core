@if (vm$ | async; as gameState) {
    <div class="flex flex-column w-100">
        @for (history of gameState.history; track $index) {
            <div
                class="flex flex-wrap mb3 pv2 br4 white-90 f4 ba"
                [ngClass]="history.playerCorrect ? 'b--blue' : 'b--red'">
                <div class="w-50">
                    <div class="pl3 neon">
                        {{ history.operation.a }} + {{ history.operation.b }} =
                    </div>
                </div>
                <div
                    class="w-25 tc truncate"
                    [matTooltip]="`${history.playerInput}`"
                    [matTooltipClass]="
                        history.playerCorrect ? 'blue-tooltip' : 'red-tooltip'
                    "
                    matTooltipPosition="above"
                    [ngClass]="history.playerCorrect ? 'white' : 'red'">
                    {{ history.playerInput }}
                </div>
                @if (!history.playerCorrect) {
                    <div class="w-25 tc blue neon truncate">
                        {{ history.operation.result }}
                    </div>
                }

                <div
                    class="w-100 tc pt2 neon"
                    [ngClass]="history.playerCorrect ? 'white' : 'red'">
                    {{ history.playerCorrect ? 'CORRECT!' : 'WRONG!' }}
                </div>
            </div>
        }
    </div>
}
